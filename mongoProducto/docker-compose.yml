services:

  mongo-db:
    image: mongo:8.0
    container_name: mongo-db
    restart: always
    ports:
      - "27017:27017"

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-producto-service:
    build: .
    container_name: mongo-producto-service
    ports:
      - "8082:8082"
    depends_on:
      mongo-db:
        condition: service_healthy