services:

  mysql-db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: demo_db
    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 30s
      retries: 10

  demo-service:
    build: .
    container_name: demo-service
    ports:
      - "8080:8080"

    depends_on:
      mysql-db:
        condition: service_healthy

