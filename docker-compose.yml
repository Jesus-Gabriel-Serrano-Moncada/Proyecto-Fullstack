services:

  # BASES DE DATOS


  mongo-db:
    image: mongo:8.0
    container_name: mongo-db
    restart: always
    ports:
      - "27017:27017"

  mysql-db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 30s
      retries: 10

  # USUARIO MONGO

  usuario-service:
    build: ./UsuarioMongo
    container_name: usuario-service

    ports:
      - "8081:8081"

    depends_on:
      - mongo-db

  # PRODUCTO MONGO

  producto-service:
    build: ./mongoProducto
    container_name: producto-service

    ports:
      - "8082:8082"

    depends_on:
      - mongo-db

  # CARRITO

  carrito-service:
    build: ./Carrito
    container_name: carrito-service

    ports:
      - "8083:8083"

    depends_on:
      mysql-db:
        condition: service_healthy


  # ORDENES

  ordenes-service:
    build: ./Ordenes
    container_name: ordenes-service

    ports:
      - "8084:8084"

    depends_on:
      mysql-db:
        condition: service_healthy


  # PAGOS

  pagos-service:
    build: ./Pagos
    container_name: pagos-service

    ports:
      - "8085:8085"

    depends_on:
      mysql-db:
        condition: service_healthy

  # INVENTARIO

  inventario-service:
    build: ./Inventario
    container_name: inventario-service

    ports:
      - "8086:8086"

    depends_on:
      mysql-db:
        condition: service_healthy

  # ENVIOS

  envios-service:
    build: ./Envios
    container_name: envios-service

    ports:
      - "8087:8087"

    depends_on:
      mysql-db:
        condition: service_healthy

  # NOTIFICACIONES

  notificaciones-service:
    build: ./Notificaciones
    container_name: notificaciones-service

    ports:
      - "8088:8088"

    depends_on:
      mysql-db:
        condition: service_healthy