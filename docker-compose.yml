services:

  mongo-db:
    image: mongo:8.0
    container_name: mongo-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  usuario-service:
    image: proyecto-fullstack-usuario-service
    container_name: usuario-service
    ports:
      - "9081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mongo-db:
        condition: service_healthy

  producto-service:
    image: proyecto-fullstack-producto-service
    container_name: producto-service
    ports:
      - "9082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mongo-db:
        condition: service_healthy

  carrito-service:
    image: proyecto-fullstack-carrito-service
    container_name: carrito-service
    ports:
      - "9083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-db:
        condition: service_healthy
      usuario-service:
        condition: service_started
      producto-service:
        condition: service_started

  ordenes-service:
    image: proyecto-fullstack-ordenes-service
    container_name: ordenes-service
    ports:
      - "9084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-db:
        condition: service_healthy
      usuario-service:
        condition: service_started
      producto-service:
        condition: service_started
      pagos-service:
        condition: service_started

  pagos-service:
    image: proyecto-fullstack-pagos-service
    container_name: pagos-service
    ports:
      - "9085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-db:
        condition: service_healthy

  inventario-service:
    image: proyecto-fullstack-inventario-service
    container_name: inventario-service
    ports:
      - "9086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-db:
        condition: service_healthy

  envios-service:
    image: proyecto-fullstack-envios-service
    container_name: envios-service
    ports:
      - "9087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-db:
        condition: service_healthy

  notificaciones-service:
    image: proyecto-fullstack-notificaciones-service
    container_name: notificaciones-service
    ports:
      - "9088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mongo-data:
  mysql-data: